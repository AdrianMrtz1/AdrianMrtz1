<svg width="900" height="250" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="250" fill="black"/>

  <!-- Floating particles -->
  <circle cx="100" cy="80" r="3" fill="#00ff66">
    <animate attributeName="cy" values="80;40;80" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="200" r="4" fill="#00ff66">
    <animate attributeName="cy" values="200;160;200" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="50" r="3" fill="#00ff66">
    <animate attributeName="cy" values="50;90;50" dur="5s" repeatCount="indefinite"/>
  </circle>

  <text x="50%" y="55%" fill="#00ff66" font-family="monospace" font-size="40" text-anchor="middle">
    Adrian Martinez
  </text>
  <text x="50%" y="72%" fill="#00ff66" font-size="22" font-family="monospace" text-anchor="middle">
    Forecasting • ML • Data
  </text>
</svg>
